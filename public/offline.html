<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3B372B" />
    <title>Offline · LQK Teachers</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background: #FBF6EC;
        color: #3B372B;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card { max-width: 340px; }
      img { width: 76px; height: 76px; margin-bottom: 18px; }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.55; color: #776E5D; margin: 0 0 22px; }
      button {
        background: #3B372B;
        color: #FBF6EC;
        border: 0;
        border-radius: 12px;
        padding: 11px 20px;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="LQK Teachers Portal" />
      <h1>You're offline</h1>
      <p>The Teachers Portal needs an internet connection. Check your network and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
